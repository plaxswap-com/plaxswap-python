[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plaxswap"
version = "0.1.0"
description = "Official Plaxswap API client: accept crypto payments (hosted checkout, payment links, signed webhooks) and quote crypto swaps."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Plaxswap", email = "support@plaxswap.com" }]
keywords = ["plaxswap", "crypto payments", "crypto payment gateway", "payment gateway", "bitcoin", "usdt", "stablecoin", "webhooks", "crypto swap"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://plaxswap.com"
Documentation = "https://plaxswap.com/developers/payments"
"API reference" = "https://plaxswap.com/api/v1/openapi.json"
Source = "https://github.com/plaxswap-com/plaxswap-python"
Issues = "https://github.com/plaxswap-com/plaxswap-python/issues"

[tool.setuptools.packages.find]
where = ["src"]
